<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#B85C7C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="#ffffff"/>

  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#3B2434">Project Atlas</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#8A6D78">End-to-end PostgreSQL data warehouse pipeline</text>

  <!-- connecting arrows -->
  <line x1="234" y1="230" x2="266" y2="230" stroke="#E799B3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="230" x2="496" y2="230" stroke="#E799B3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="694" y1="230" x2="726" y2="230" stroke="#E799B3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="924" y1="230" x2="956" y2="230" stroke="#E799B3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: Raw Data Sources -->
  <g>
    <rect x="24" y="140" width="210" height="180" rx="14" fill="#FDF2F6" stroke="#E799B3" stroke-width="1.5"/>
    <g transform="translate(94,168)">
      <rect x="0" y="10" width="70" height="16" rx="3" fill="#E799B3"/>
      <rect x="0" y="30" width="70" height="16" rx="3" fill="#E799B3" opacity="0.7"/>
      <rect x="0" y="50" width="70" height="16" rx="3" fill="#E799B3" opacity="0.45"/>
    </g>
    <text x="129" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2434">Raw data sources</text>
    <text x="129" y="292" text-anchor="middle" font-size="12" fill="#8A6D78">16 business</text>
    <text x="129" y="308" text-anchor="middle" font-size="12" fill="#8A6D78">domains</text>
  </g>

  <!-- Stage 2: PostgreSQL Warehouse -->
  <g>
    <rect x="266" y="140" width="230" height="180" rx="14" fill="#FDF2F6" stroke="#E799B3" stroke-width="1.5"/>
    <g transform="translate(346,172)">
      <ellipse cx="35" cy="8" rx="35" ry="8" fill="#E799B3"/>
      <path d="M0,8 L0,52 A35,8 0 0,0 70,52 L70,8" fill="#E799B3" opacity="0.55"/>
      <ellipse cx="35" cy="52" rx="35" ry="8" fill="#E799B3" opacity="0.8"/>
    </g>
    <text x="381" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2434">PostgreSQL</text>
    <text x="381" y="288" text-anchor="middle" font-size="12" fill="#8A6D78">Star-schema warehouse</text>
    <text x="381" y="304" text-anchor="middle" font-size="12" fill="#8A6D78">Conformed dimensions</text>
  </g>

  <!-- Stage 3: Python + SQL Validation -->
  <g>
    <rect x="496" y="140" width="230" height="180" rx="14" fill="#FDF2F6" stroke="#E799B3" stroke-width="1.5"/>
    <g transform="translate(586,178)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#E799B3" stroke-width="5"/>
      <line x1="33" y1="33" x2="50" y2="50" stroke="#E799B3" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="611" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2434">Validation</text>
    <text x="611" y="288" text-anchor="middle" font-size="12" fill="#8A6D78">Python + SQL profiling</text>
    <text x="611" y="304" text-anchor="middle" font-size="12" fill="#8A6D78">1.97M+ records checked</text>
  </g>

  <!-- Stage 4: KPI Views -->
  <g>
    <rect x="726" y="140" width="230" height="180" rx="14" fill="#FDF2F6" stroke="#E799B3" stroke-width="1.5"/>
    <g transform="translate(806,176)">
      <rect x="0" y="34" width="14" height="26" fill="#E799B3" opacity="0.55"/>
      <rect x="20" y="20" width="14" height="40" fill="#E799B3" opacity="0.75"/>
      <rect x="40" y="8" width="14" height="52" fill="#E799B3"/>
      <rect x="60" y="26" width="14" height="34" fill="#E799B3" opacity="0.65"/>
    </g>
    <text x="841" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2434">KPI views</text>
    <text x="841" y="288" text-anchor="middle" font-size="12" fill="#8A6D78">Reusable SQL queries</text>
    <text x="841" y="304" text-anchor="middle" font-size="12" fill="#8A6D78">Cross-domain trends</text>
  </g>

  <!-- Stage 5: Dashboards -->
  <g>
    <rect x="956" y="140" width="220" height="180" rx="14" fill="#FDF2F6" stroke="#E799B3" stroke-width="1.5"/>
    <g transform="translate(1026,174)">
      <rect x="0" y="0" width="80" height="56" rx="4" fill="none" stroke="#E799B3" stroke-width="3"/>
      <line x1="14" y1="42" x2="14" y2="28" stroke="#E799B3" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="42" x2="30" y2="16" stroke="#E799B3" stroke-width="4" stroke-linecap="round"/>
      <line x1="46" y1="42" x2="46" y2="24" stroke="#E799B3" stroke-width="4" stroke-linecap="round"/>
      <line x1="62" y1="42" x2="62" y2="10" stroke="#E799B3" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1066" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2434">Dashboards</text>
    <text x="1066" y="288" text-anchor="middle" font-size="12" fill="#8A6D78">Tableau + Power BI</text>
    <text x="1066" y="304" text-anchor="middle" font-size="12" fill="#8A6D78">Operational reporting</text>
  </g>

  <text x="600" y="380" text-anchor="middle" font-size="12" fill="#B08998">github.com/nehalipp/Project-Atlas</text>
</svg>
